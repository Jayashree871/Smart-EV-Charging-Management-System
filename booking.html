<!DOCTYPE html>
<html>
<head>
<title>Book Slot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h2>Book Charging Slot</h2>

<select>
<option>Green Charge Hub</option>
<option>Fast EV Station</option>
<option>EV Power Grid</option>
</select>

<input type="date">
<input type="time">

<button onclick="showMessage()">
Confirm Booking
</button>

<p id="msg"></p>

<script>
function showMessage() {
document.getElementById("msg").innerHTML =
"✅ Slot Booked Successfully!";
}
</script>

</div>

</body>
</html>
